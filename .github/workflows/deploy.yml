name: Deploy Next.js to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/compro_2388010037:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          script: |
            # Hentikan dan hapus container lama jika ada
            docker stop compro_nim || true
            docker rm -f compro_nim || true
            
            # Hapus image lama agar menarik yang paling baru
            docker rmi -f ${{ secrets.DOCKERHUB_USERNAME }}/compro_2388010037:latest || true
            
            # Ambil image terbaru dari Docker Hub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/compro_2388010037:latest
            
            # Jalankan container: mapping port 80 EC2 ke port 3000 Next.js
            docker run -d --name compro_nim -p 80:3000 ${{ secrets.DOCKERHUB_USERNAME }}/compro_2388010037:latest