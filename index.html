<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page Tech</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0a0f2c, #1a1f4d);
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
    }

    header h1 {
      font-size: 18px;
      font-weight: bold;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #ccc;
      font-size: 14px;
    }

    nav a:hover {
      color: white;
    }

    .btn {
      padding: 10px 20px;
      border: 1px solid #6c7cff;
      border-radius: 20px;
      color: white;
      text-decoration: none;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 80px 50px;
    }

    .hero-text {
      max-width: 600px;
    }

    .badge {
      display: inline-block;
      padding: 8px 15px;
      border: 1px solid #3d4fff;
      border-radius: 20px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #8aa0ff;
    }

    .hero-text h2 {
      font-size: 48px;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .card {
      width: 300px;
      height: 180px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
    }
  </style>
</head>
<body>

  <header>
    <h1>kholik_2388010037<span style="color:#4fc3f7">Tech</span></h1>
    <nav>
      <a href="#">Beranda</a>
      <a href="#">Layanan</a>
      <a href="#">Visi</a>
      <a href="#">Kontak</a>
      <a href="#" class="btn">Konsultasi</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-text">
      <div class="badge">Innovating Tomorrow, Today</div>
      <h2>Menciptakan Inovasi Digital untuk Masa Depan yang Lebih Baik</h2>
    </div>

    <div class="card">
      Platform Intelligence
    </div>
  </section>

</body>
</html>
