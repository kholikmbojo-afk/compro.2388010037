<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page Tech</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(120deg, #0b1026, #1a1f4d, #0b1026);
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 60px;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    nav a {
      margin: 0 18px;
      text-decoration: none;
      color: #9aa3b2;
      font-size: 14px;
      transition: 0.3s;
    }

    nav a:hover {
      color: white;
    }

    .btn {
      padding: 10px 22px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 25px;
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(8px);
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 100px 60px;
    }

    .hero-text {
      max-width: 650px;
    }

    .badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 25px;
      background: rgba(0, 140, 255, 0.15);
      border: 1px solid rgba(0,140,255,0.3);
      color: #6fb3ff;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .hero-text h2 {
      font-size: 56px;
      line-height: 1.2;
      font-weight: 700;
    }

    .card {
      width: 360px;
      height: 220px;
      border-radius: 25px;
      background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      backdrop-filter: blur(20px);
      box-shadow: 0 15px 50px rgba(0,0,0,0.5);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      flex-direction: column;
      padding: 25px;
      margin-top: 60px;
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 25px;
      padding: 1px;
      background: linear-gradient(120deg, rgba(255,255,255,0.2), transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
    }

    .card small {
      color: #9ecbff;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .card h3 {
      font-size: 20px;
      font-weight: 600;
      color: white;
    }

    @media(max-width: 900px) {
      .hero {
        flex-direction: column;
        text-align: center;
      }

      .hero-text h2 {
        font-size: 40px;
      }

      .card {
        margin-top: 40px;
      }
    }

  </style>
</head>
<body>

  <header>
    <h1>kholik_2388010037<span style="color:#4fc3f7">Tech</span></h1>
    <nav>
      <a href="#">Beranda</a>
      <a href="#">Layanan</a>
      <a href="#">Visi</a>
      <a href="#">Kontak</a>
      <a href="#" class="btn">Konsultasi</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-text">
      <div class="badge">Innovating Tomorrow, Today</div>
      <h2>
        Menciptakan<br>
        Inovasi Digital<br>
        untuk Masa<br>
        Depan yang
      </h2>
    </div>

    <div class="card">
      <small>Platform Intelligence</small>
      <h3>AI-Powered Digital Ecosystem</h3>
    </div>
  </section>

</body>
</html>
